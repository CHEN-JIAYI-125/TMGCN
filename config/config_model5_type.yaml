# ------------------------------------------------------------------
# claim/noun 分头 + 翻转 noun 金标辅助 CE + 会话立场 Qwen embedding。
# 先生成 cache，再训练：
#   python3.9 offline/build_qwen_graph.py --config config/config_model5_type.yaml \
#     --model /home/chenjiayi/models/Qwen3-Embedding-8B \
#     --output /mnt/data/chenjiayi/csd/qwen_stance --device cuda:0 --overwrite
#   python3.9 main_graph.py config/config_model5_type.yaml
# ------------------------------------------------------------------

train_path: /home/chenjiayi/data/csd/raw_with_all_labels_v3/raw_with_global_ids/train_data.json
dev_path: /home/chenjiayi/data/csd/raw_with_all_labels_v3/raw_with_global_ids/dev_data.json
test_path: /home/chenjiayi/data/csd/raw_with_all_labels_v3/raw_with_global_ids/test_data.json
embedding_npy: /mnt/data/chenjiayi/csd/qwen_stance/embeddings.npy
target_knowledge_npy: /mnt/data/chenjiayi/csd/qwen_stance/target_knowledge.npy

hidden_size: 768
input_size: 0
num_classes: 3
dropout: 0.1
input_dropout: 0.0
num_layers: 2
hypergraph_attention: true
rgcn_num_bases: 0
use_grounding: true
use_speaker: 1
use_dialogue: 1
use_temporal: 1
use_reply: 1

cl_lambda: 1.0
cl_mode: augment
cl_pos_weight_same_target: 1.0
cl_pos_weight_diff_target: 0.5
cl_temperature: 0.2
cl_feat_mask_rate: 0.2
cl_noise_scale: 0.1
cl_proj_dim: 128

bidirectional_temporal: false
max_nodes_per_target: 0

use_claim_noun_polarity: false
use_target_claim_mlp: false
use_type_heads: true
opp_lambda: 0.3

epoch_size: 20
batchsize: 16
patience: 0
max_grad_norm: 1.0
warmup_proportion: 0.2
warmup_steps: 0
gradient_accumulation_steps: 1
adam_epsilon: 1.0e-8
lr: 1.0e-4
weight_decay: 1.0e-5
logging_steps: 10

cuda_index: 0
seed: 1234
debug: false
time: ""
model_type: GraphTracer_5
result_root: ./result
metric_on_last_sentence: true
